<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' http://localhost:3000 http://*.execute-api.localhost.floci.io:4566; style-src 'self'">
  <title>Elections – Admin</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../">
  <header></header>
  <main class="wide">
    <p id="flash" class="flash" role="alert"></p>

    <section class="card">
      <h2>Create a new election</h2>
      <p class="hint">It starts as a draft. Next you add positions, candidates and the students who can vote, then schedule it.</p>
      <form id="create-form" class="grid2">
        <label>Title <input id="c-title" required minlength="3" maxlength="120" placeholder="e.g. Student Union Elections 2026"></label>
        <label>Description <input id="c-desc" maxlength="1000" placeholder="Optional"></label>
        <label>Voting opens <input id="c-start" type="datetime-local" required></label>
        <label>Voting closes <input id="c-end" type="datetime-local" required></label>
        <div class="form-actions"><button type="submit">Create election</button></div>
      </form>
    </section>

    <section class="card">
      <div class="row">
        <h2>Elections</h2>
        <input id="search" placeholder="Search by title" maxlength="50">
        <select id="status-filter">
          <option value="">All statuses</option>
          <option value="DRAFT">Draft</option><option value="SCHEDULED">Scheduled</option><option value="OPEN">Voting open</option>
          <option value="CLOSED">Voting closed</option><option value="TALLIED">Counted</option><option value="PUBLISHED">Results published</option>
          <option value="CANCELLED">Cancelled</option>
        </select>
      </div>
      <table>
        <thead><tr><th>Title</th><th>Status</th><th>Opens</th><th>Closes</th><th>Created by</th></tr></thead>
        <tbody id="elections"></tbody>
      </table>
    </section>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="js/elections.js"></script>
</body>
</html>
