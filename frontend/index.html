<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' http://localhost:3000 http://*.execute-api.localhost.floci.io:4566; style-src 'self'">
  <title>Student Election Voting</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>Student Election Voting</h1><span id="api-status">checking API…</span></header>
  <main>
    <form id="login-form">
      <h2>Sign in</h2>
      <label>Email <input id="email" type="email" required autocomplete="username"></label>
      <label>Password <input id="password" type="password" required autocomplete="current-password"></label>
      <!-- Cloudflare Turnstile (site key is public). 1x00000000000000000000AA = Cloudflare's test key; replace with the real one. -->
      <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA"></div>
      <button type="submit">Sign in</button>
      <p id="message" role="alert"></p>
      <p class="hint">Student without an account? <a href="register.html">Create account</a></p>
    </form>
    <!-- TODO per owner: admin/ (Mo'men), student/ (Osama), auditor/ (Khaled) pages share this nav + api.js -->
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/index.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
