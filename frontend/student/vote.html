<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' http://localhost:3000 http://*.execute-api.localhost.floci.io:4566; style-src 'self'">
  <title>Vote – Student</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="student.css">
</head>
<body data-root="../">
  <header></header>
  <main>
    <p id="flash" class="flash" role="alert"></p>
    <a class="back" href="index.html">← My elections</a>

    <form id="ballot-form" class="card" hidden>
      <h2 id="title"></h2>
      <p class="hint" id="info"></p>
      <div id="positions"></div>
      <!-- 1x00000000000000000000AA = Cloudflare's test site key; replace with the real one. -->
      <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA"></div>
      <div class="form-actions"><button type="submit">Review my vote</button></div>
    </form>

    <section id="review" class="card" hidden>
      <h2>Check your choices</h2>
      <ul id="review-list" class="plain review"></ul>
      <div class="actions">
        <button type="button" id="submit-vote">Submit my vote</button>
        <button type="button" id="change" class="secondary">Change</button>
      </div>
    </section>

    <section id="receipt" class="card" hidden>
      <h2>Your vote was recorded ✔</h2>
      <p>Save this receipt code. It is shown <strong>only once</strong> (we also emailed it to you). It proves your vote was counted; it does not show who you voted for.</p>
      <p id="receipt-code" class="receipt-code"></p>
      <div class="row">
        <button type="button" id="copy" class="secondary">Copy code</button>
        <a id="receipt-link" class="button-link" href="receipt.html">My receipt</a>
        <a href="index.html">Back to my elections</a>
      </div>
    </section>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="js/vote.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
